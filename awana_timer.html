<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awana Buzzer Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0a1628;
      --navy-mid:  #112040;
      --navy-lite: #1a3060;
      --gold:      #c9962a;
      --gold-lite: #e8b84b;
      --gold-pale: #f5d98a;
      --red:       #a81c1c;
      --red-lite:  #cc2828;
      --cream:     #f7f0e0;
    }

    body {
      background: var(--navy);
      color: var(--cream);
      font-family: 'Merriweather', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /*  Left/Right Ribbon borders  */
    body::before, body::after {
      content: '';
      position: fixed;
      top: 0; bottom: 0;
      width: 12px;
      background: linear-gradient(
        90deg,
        var(--red)      50%,
        var(--gold)     50%
      );
      z-index: 100;
    }
    body::before { left: 0; }
    body::after  { right: 0; }

    /*  Top ribbon bar  */
    .top-ribbon {
      height: 5px;
      background: linear-gradient(90deg,
        var(--red) 0%, var(--gold) 25%,
        var(--red) 50%, var(--gold) 75%, var(--red) 100%);
      margin: 0 18px;
    }

    .page-wrapper {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 40px 60px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 32px 0 24px;
      position: relative;
    }

    .logo-slot {
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      background: var(--navy-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .logo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: none; }
    .logo-slot-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-align: center;
      line-height: 1.3;
      text-transform: uppercase;
      user-select: none;
    }
    #logoInput { display: none; }

    .title-lock {
      font-family: 'Cinzel', serif;
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--gold-lite);
      text-shadow: 0 0 30px rgba(201,150,42,0.4);
      line-height: 1.1;
    }
    .subtitle-text {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--gold);
      opacity: 0.7;
      text-transform: uppercase;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    /* editable title/subtitle */
    [contenteditable]:focus { outline: 1px dashed var(--gold); border-radius: 3px; }

    /*  Gold divider  */
    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 20px 0;
    }
    /* Names */
    .name-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 20px;
    }
    .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--navy-mid);
    border: 1px solid rgba(201,150,42,0.2);
    border-radius: 4px;
    padding: 8px 12px;
    }
    .name-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    min-width: 24px;
    }
    .name-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(201,150,42,0.3);
    color: var(--cream);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 2px 4px;
    outline: none;
    }
    .name-input:focus { border-bottom-color: var(--gold); }
    .name-input::placeholder { color: rgba(247,240,224,0.25); }

    .config-header {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.7;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
    }

    button {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 11px 24px;
      border: 2px solid;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }

    #btnConnect {
      background: var(--navy-mid);
      color: var(--gold-lite);
      border-color: var(--gold);
    }
    #btnConnect:hover { background: var(--gold); color: var(--navy); }
    #btnConnect.connected { background: var(--gold); color: var(--navy); }

    #btnQuestion {
      background: var(--red);
      color: #fff;
      border-color: var(--red-lite);
    }
    #btnQuestion:hover { background: var(--red-lite); }

    #btnReset {
      background: transparent;
      color: var(--cream);
      border-color: rgba(247,240,224,0.35);
    }
    #btnReset:hover { border-color: var(--cream); background: rgba(247,240,224,0.08); }

    #btnStop {
      background: transparent;
      color: rgba(247,240,224,0.55);
      border-color: rgba(247,240,224,0.2);
    }
    #btnStop:hover { color: var(--cream); border-color: rgba(247,240,224,0.5); }

    /* ── Status panel ── */
    .status-panel {
      background: var(--navy-mid);
      border: 1px solid rgba(201,150,42,0.25);
      border-radius: 6px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #questionTime {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--gold-pale);
      min-height: 22px;
    }

    .lock-badge {
      display: none;
      background: var(--red);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 3px;
    }
    .lock-badge.visible { display: inline-block; }

    /* ── Scoreboard ── */
    .scoreboard-wrap {
      background: var(--navy-mid);
      border: 1px solid rgba(201,150,42,0.3);
      border-radius: 6px;
      overflow: hidden;
    }
    .scoreboard-header {
      background: linear-gradient(90deg, var(--navy-lite), var(--navy-mid));
      border-bottom: 2px solid var(--gold);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .scoreboard-header span {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .sb-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
    }

    #scoreboard { padding: 8px 0; min-height: 56px; }

    .sb-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(201,150,42,0.1);
      animation: slideIn 0.25s ease;
      transition: background 0.15s;
    }
    .sb-row:last-child { border-bottom: none; }
    .sb-row:hover { background: rgba(201,150,42,0.06); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .sb-rank {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      min-width: 36px;
      color: var(--gold);
      opacity: 0.5;
    }
    .sb-row:first-child .sb-rank { color: var(--gold-lite); opacity: 1; font-size: 24px; }
    .sb-row:nth-child(2) .sb-rank { color: #bcc4cc; opacity: 0.9; }
    .sb-row:nth-child(3) .sb-rank { color: #c08050; opacity: 0.9; }

    .sb-crown {
      font-size: 18px;
      margin-right: 4px;
      display: none;
    }
    .sb-row:first-child .sb-crown { display: inline; }

    .sb-name {
      flex: 1;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--cream);
    }
    .sb-row:first-child .sb-name { font-size: 22px; color: #fff; }

    .sb-time {
      font-size: 17px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--gold-pale);
      letter-spacing: 0.03em;
    }
    .sb-row:first-child .sb-time { color: var(--gold-lite); font-size: 19px; }

    .sb-empty {
      text-align: center;
      padding: 28px 20px;
      color: rgba(247,240,224,0.3);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Bottom ribbon ── */
    .bottom-ribbon {
      height: 8px;
      background: linear-gradient(90deg,
        var(--gold) 0%, var(--red) 25%,
        var(--gold) 50%, var(--red) 75%, var(--gold) 100%);
      margin: 0 18px;
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
    }
  </style>
</head>
<body>

<div class="top-ribbon"></div>

<div class="page-wrapper">

  <header>
    <img src="maranatha.png" alt="Logo" style="width:90px; height:90px; border-radius:50%; border:3px solid var(--gold); object-fit:cover; margin: 0 auto 16px; display:block;">

    <div class="title-lock">Maranatha Chapel Awana Bible Quiz</div>
    <div class="subtitle-text">Buzzer Timer System</div>
  </header>

  <div class="divider"></div>

  <div class="config-header">Buzzer Names</div>
    <div class="name-grid">
        <div class="name-row"><span class="name-label">1</span><input class="name-input" data-buzzer="1" placeholder="Buzzer 1" maxlength="16"></div>
        <div class="name-row"><span class="name-label">2</span><input class="name-input" data-buzzer="2" placeholder="Buzzer 2" maxlength="16"></div>
        <div class="name-row"><span class="name-label">3</span><input class="name-input" data-buzzer="3" placeholder="Buzzer 3" maxlength="16"></div>
        <div class="name-row"><span class="name-label">4</span><input class="name-input" data-buzzer="4" placeholder="Buzzer 4" maxlength="16"></div>
        <div class="name-row"><span class="name-label">5</span><input class="name-input" data-buzzer="5" placeholder="Buzzer 5" maxlength="16"></div>
        <div class="name-row"><span class="name-label">6</span><input class="name-input" data-buzzer="6" placeholder="Buzzer 6" maxlength="16"></div>
        <div class="name-row"><span class="name-label">7</span><input class="name-input" data-buzzer="7" placeholder="Buzzer 7" maxlength="16"></div>
        <div class="name-row"><span class="name-label">8</span><input class="name-input" data-buzzer="8" placeholder="Buzzer 8" maxlength="16"></div>
        <div class="name-row"><span class="name-label">9</span><input class="name-input" data-buzzer="9" placeholder="Buzzer 9" maxlength="16"></div>
        <div class="name-row"><span class="name-label">10</span><input class="name-input" data-buzzer="10" placeholder="Buzzer 10" maxlength="16"></div>
    </div>
    <div class="divider"></div>

  <div class="controls">
    <button id="btnConnect">Connect to Arduino</button>
    <button id="btnQuestion">▶ Start Question</button>
    <button id="btnStop">■ Stop Timer</button>
    <button id="btnReset">↺ Reset Round</button>
  </div>

  <div class="status-panel">
    <div id="questionTime">Waiting to start…</div>
    <span class="lock-badge" id="lockBadge">🔒 Locked</span>
  </div>

  <div class="scoreboard-wrap">
    <div class="scoreboard-header">
      <div class="sb-dot"></div>
      <span>Scoreboard</span>
      <div class="sb-dot"></div>
    </div>
    <div id="scoreboard">
      <div class="sb-empty">No buzzers yet — start a question</div>
    </div>
  </div>

</div>

<div class="bottom-ribbon"></div>

<script>
  let port = null;
  let locked = false;
  let buzzers = [];
  let questionStartTime = null;
  let questionInterval = null;

  // Arduino connect
  document.getElementById('btnConnect').addEventListener('click', async () => {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    const btn = document.getElementById('btnConnect');
    btn.textContent = '✓ Connected';
    btn.classList.add('connected');
    readSerial();
  });
  // Reset Button
  document.getElementById('btnReset').addEventListener('click', async () => {
    if (!port) { alert('Connect to Arduino first!'); return; }
    const writer = port.writable.getWriter();
    await writer.write(new TextEncoder().encode('R'));
    writer.releaseLock();
  });
  // Question Button
  document.getElementById('btnQuestion').addEventListener('click', async () => {
    clearInterval(questionInterval);
    questionStartTime = Date.now();
    questionInterval = setInterval(() => {
      const elapsed = ((Date.now() - questionStartTime) / 1000).toFixed(2);
      document.getElementById('questionTime').textContent = `Question time: ${elapsed}s`;
    }, 50);
    if (port) {
      const writer = port.writable.getWriter();
      await writer.write(new TextEncoder().encode('Q'));
      writer.releaseLock();
    }
  });
  // Stop Button 
  document.getElementById('btnStop').addEventListener('click', () => {
    clearInterval(questionInterval);
    questionStartTime = null;
    document.getElementById('questionTime').textContent = 'Timer stopped';
  });

  async function readSerial() {
    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    const reader = decoder.readable.getReader();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let lines = buffer.split('\n');
      buffer = lines.pop();
      lines.forEach(line => { line = line.trim(); if (line) parseLine(line); });
    }
  }

  function parseLine(line) {
    if (line.startsWith('BUZZ,')) {
      if (locked) return;
      const parts = line.split(',');
      const buzzerNum = parseInt(parts[1]);
      const microseconds = parseInt(parts[2]);
      const input = document.querySelector(`.name-input[data-buzzer="${buzzerNum}"]`);
      const name = (input && input.value.trim()) ? input.value.trim() : `Buzzer ${buzzerNum}`;
      const milliseconds = parseFloat((microseconds / 1000).toFixed(2));
      buzzers.push({ num: buzzerNum, ms: milliseconds, name });
      buzzers.sort((a, b) => a.ms - b.ms);
      renderScoreboard();
    }
    if (line === 'RESET! Ready for next round!') {
      buzzers = [];
      locked = false;
      document.getElementById('lockBadge').classList.remove('visible');
      renderScoreboard();
      document.getElementById('questionTime').textContent = 'Waiting to start…';
      questionStartTime = null;
      clearInterval(questionInterval);
    }
    if (line === 'LOCKED') {
      locked = true;
      document.getElementById('lockBadge').classList.add('visible');
    }
    if (line.startsWith('QUESTION_TIME,')) {
      const ms = parseInt(line.split(',')[1]);
      clearInterval(questionInterval);
      document.getElementById('questionTime').textContent =
        `First buzz: ${(ms / 1000).toFixed(3)}s after question`;
    }
  }

  function renderScoreboard() {
    const sb = document.getElementById('scoreboard');
    if (buzzers.length === 0) {
      sb.innerHTML = '<div class="sb-empty">No buzzers yet — start a question</div>';
      return;
    }
    sb.innerHTML = '';
    buzzers.forEach((b, i) => {
      const row = document.createElement('div');
      row.className = 'sb-row';
      row.innerHTML = `
        <span class="sb-rank">${i + 1}</span>
        <span class="sb-crown">👑</span>
        <span class="sb-name">Buzzer ${b.num} - ${b.name}</span>
        <span class="sb-time">${(b.ms / 1000).toFixed(3)}s</span>
      `;
      sb.appendChild(row);
    });
  }
</script>
</body>
</html>
